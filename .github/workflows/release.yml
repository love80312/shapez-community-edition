name: Release

on:
  push:
    branches:
      - "000"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 修正點：改用 Node 22 以支援內建 fetch 並符合 ESLint 等插件要求
          node-version: '22'
          cache: 'npm'

      - name: Install ffmpeg
        run: choco install ffmpeg -y

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # 建議用 Java 17 或 21，通常對新版 TexturePacker 支援度更好
          java-version: '21'

      - name: Install root dependencies
        # 使用 --force 是為了防止某些舊依賴在 Node 22 下產生衝突
        run: npm install --force

      - name: Install electron dependencies
        run: npm install --force
        working-directory: electron

      - name: Build and Package
        # 直接執行封裝指令
        run: npm run package-win32-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shapez-win32-x64
          path: build_output/standalone/
          if-no-files-found: error
          retention-days: 7
