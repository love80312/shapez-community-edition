name: Release

on:
  push:
    branches:
      - 000

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install ffmpeg
        run: choco install ffmpeg -y

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install electron dependencies
        run: npm ci
        working-directory: electron

      # 修正：根據你的 build_variants.js，任務名稱中間必須是 .standalone.
      - name: Prepare Assets and Build
        run: npx gulp --cwd gulp package.standalone.win32-x64.prepare.all

      # 修正：這裡對應 package.json 裡的腳本
      - name: Package Windows x64
        run: npm run package-win32-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shapez-win32-x64
          # 這裡的路徑也要對應 variant 名稱
          path: build_output/standalone/
          if-no-files-found: error
          retention-days: 7
